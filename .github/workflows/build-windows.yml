name: Build Windows (.exe)

# Roda: manualmente (aba Actions → "Run workflow"), a cada push na main ou na dev que mexa no app
# (o .zip fica em Actions → execução → Artifacts) e ao criar uma tag v* (vira Release).
# Fluxo: o trabalho novo vai para a dev; o executável de teste sai daqui; depois do teste no
# Windows, a dev entra na main.
# Release pelo site: "Run workflow" com a versão (ex.: v0.1.14) cria o rascunho de pre-release;
# a tag nasce quando o rascunho é publicado.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Para criar o rascunho do Release, a versão com v (ex.: v0.1.14). Vazio = só gerar o executável de teste."
        required: false
        default: ""
  push:
    branches: [main, dev]
    paths:
      - "transcritor/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
    tags: ["v*"]

permissions:
  contents: write   # necessário para anexar o .zip ao Release

env:
  VERSAO: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.versao }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: FFmpeg para os testes
        run: choco install ffmpeg -y --no-progress

      - name: Testes
        run: pytest -q

      - name: Gerar executável
        run: pyinstaller packaging/transcritor.spec --noconfirm --distpath dist --workpath build

      # Sem FFmpeg dentro do pacote: o app baixa a versão fixa na primeira abertura (ADR-021).
      - name: Licenças e instruções
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/TranscritorLocal/licencas | Out-Null
          Copy-Item LICENSE dist/TranscritorLocal/licencas/TranscritorLocal-LICENSE.txt
          Copy-Item docs/LICENCAS_TERCEIROS.md dist/TranscritorLocal/licencas/
          Copy-Item packaging/COMO_ABRIR.txt dist/TranscritorLocal/
          # textos de licença e avisos (NOTICE) de todas as bibliotecas Python do ambiente (achado K9)
          pip install pip-licenses
          pip-licenses --from=mixed --with-license-file --with-notice-file --no-license-path --format=plain-vertical `
            --ignore-packages pip-licenses prettytable wcwidth pytest pluggy iniconfig pyinstaller pyinstaller-hooks-contrib altgraph pefile pywin32-ctypes `
            --output-file dist/TranscritorLocal/licencas/BIBLIOTECAS.txt
          if ((Get-Item dist/TranscritorLocal/licencas/BIBLIOTECAS.txt).Length -lt 10000) { throw "BIBLIOTECAS.txt veio vazio" }

      - name: Teste de fumaça do executável
        shell: pwsh
        run: |
          $p = Start-Process dist/TranscritorLocal/TranscritorLocal.exe -ArgumentList "--autoteste" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/TranscritorLocal/transcritor.log" -ErrorAction SilentlyContinue
            throw "Autoteste do executável falhou (código $($p.ExitCode))"
          }

      - name: Impressão digital (SHA-256) do executável
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/TranscritorLocal/TranscritorLocal.exe -Algorithm SHA256).Hash.ToLower()
          "$h  TranscritorLocal.exe" | Set-Content dist/TranscritorLocal/SHA256.txt -Encoding ascii
          "SHA-256 de TranscritorLocal.exe: $h"
          "### SHA-256 de TranscritorLocal.exe`n`n``$h``" | Add-Content $env:GITHUB_STEP_SUMMARY

      # Artefato de teste: o GitHub já compacta a pasta (um zip só, sem zip dentro de zip)
      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorLocal-windows
          path: dist/TranscritorLocal/

      - name: Conferir a versão do Release
        if: env.VERSAO != ''
        shell: pwsh
        run: |
          $v = (python -c "import transcritor; print(transcritor.__version__)").Trim()
          if ("v$v" -ne $env:VERSAO) { throw "A versão pedida ($env:VERSAO) não é a do código (v$v)." }

      - name: Compactar para o Release
        if: env.VERSAO != ''
        shell: pwsh
        run: |
          $zip = "TranscritorLocal-$env:VERSAO-windows.zip"
          Compress-Archive dist/TranscritorLocal $zip
          $hexe = (Get-FileHash dist/TranscritorLocal/TranscritorLocal.exe -Algorithm SHA256).Hash.ToLower()
          $hzip = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $notas = "docs/release/$env:VERSAO.md"
          $corpo = if (Test-Path $notas) { Get-Content $notas -Raw -Encoding utf8 } else { "# Transcritor Local $env:VERSAO`n" }
          $corpo = $corpo.Replace("TranscritorLocal-windows.zip", $zip).Replace("<preenchido na publicação>", $hexe)
          $corpo += "`n`n## SHA-256`n`n| Arquivo | SHA-256 |`n|---|---|`n| ``$zip`` | ``$hzip`` |`n| ``TranscritorLocal.exe`` | ``$hexe`` |`n"
          Set-Content release_corpo.md $corpo -Encoding utf8

      # Rascunho de pre-release: o autor confere a página e publica à mão (achados B3/K7)
      - name: Criar o Release (rascunho, pre-release)
        if: env.VERSAO != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSAO }}
          target_commitish: ${{ github.sha }}
          name: Transcritor Local ${{ env.VERSAO }} (beta)
          draft: true
          prerelease: true
          body_path: release_corpo.md
          files: TranscritorLocal-*-windows.zip
