name: Build Windows (.exe)

# Roda: manualmente (aba Actions → "Run workflow"), a cada push na main que mexa no app
# (o .zip fica em Actions → execução → Artifacts) e ao criar uma tag v* (vira Release).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "transcritor/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
    tags: ["v*"]

permissions:
  contents: write   # necessário para anexar o .zip ao Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: FFmpeg para os testes
        run: choco install ffmpeg -y --no-progress

      - name: Testes
        run: pytest -q

      - name: Gerar executável
        run: pyinstaller packaging/transcritor.spec --noconfirm --distpath dist --workpath build

      - name: Embutir FFmpeg (build "essentials" de gyan.dev, GPL)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $pasta = Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force dist/TranscritorLocal/bin | Out-Null
          Copy-Item "$($pasta.FullName)/bin/ffmpeg.exe","$($pasta.FullName)/bin/ffprobe.exe" dist/TranscritorLocal/bin/
          New-Item -ItemType Directory -Force dist/TranscritorLocal/licencas | Out-Null
          Copy-Item "$($pasta.FullName)/LICENSE" dist/TranscritorLocal/licencas/FFmpeg-LICENSE.txt
          Copy-Item LICENSE dist/TranscritorLocal/licencas/TranscritorLocal-LICENSE.txt
          Copy-Item docs/LICENCAS_TERCEIROS.md dist/TranscritorLocal/licencas/
          Copy-Item packaging/COMO_ABRIR.txt dist/TranscritorLocal/
          $v = (& "$($pasta.FullName)/bin/ffmpeg.exe" -version | Select-Object -First 1)
          $num = if ($v -match 'ffmpeg version (\d+(\.\d+)+)') { $Matches[1] } else { "" }
          $fonte = if ($num) { "https://ffmpeg.org/releases/ffmpeg-$num.tar.xz" } else { "https://ffmpeg.org/download.html#releases" }
          $linhas = @(
            "Codigo-fonte do FFmpeg distribuido nesta pasta (bin/ffmpeg.exe e bin/ffprobe.exe)",
            "Versao: $v",
            "Build: https://www.gyan.dev/ffmpeg/builds/ (release essentials, licenca GPL v3)",
            "Codigo-fonte desta versao: $fonte",
            "Licenca: licencas/FFmpeg-LICENSE.txt",
            "",
            "O Transcritor Local (MIT) chama esses programas como processos separados.",
            "Quem recebeu esta pasta pode obter o codigo-fonte correspondente no endereco acima;",
            "se ele sair do ar, peca uma copia abrindo uma issue no repositorio do projeto."
          )
          $linhas | Set-Content dist/TranscritorLocal/licencas/FFmpeg-CODIGO-FONTE.txt -Encoding utf8

      - name: Teste de fumaça do executável
        shell: pwsh
        run: |
          $p = Start-Process dist/TranscritorLocal/TranscritorLocal.exe -ArgumentList "--autoteste" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/TranscritorLocal/transcritor.log" -ErrorAction SilentlyContinue
            throw "Autoteste do executável falhou (código $($p.ExitCode))"
          }

      - name: Impressão digital (SHA-256) do executável
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/TranscritorLocal/TranscritorLocal.exe -Algorithm SHA256).Hash.ToLower()
          "$h  TranscritorLocal.exe" | Set-Content dist/TranscritorLocal/SHA256.txt -Encoding ascii
          "SHA-256 de TranscritorLocal.exe: $h"
          "### SHA-256 de TranscritorLocal.exe`n`n``$h``" | Add-Content $env:GITHUB_STEP_SUMMARY

      # Artefato de teste: o GitHub já compacta a pasta (um zip só, sem zip dentro de zip)
      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorLocal-windows
          path: dist/TranscritorLocal/

      - name: Compactar para o Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive dist/TranscritorLocal "TranscritorLocal-${{ github.ref_name }}-windows.zip"

      - name: Publicar no Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TranscritorLocal-*-windows.zip
