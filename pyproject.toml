[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcritor-local"
version = "0.1.7"
description = "Transcreve vídeos para Markdown pesquisável, 100% no seu PC (Whisper + OCR), para qualquer IA ler (Claude, ChatGPT, Gemini, NotebookLM e outras)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nícolas Rosseto" }]
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "numpy",
    "pillow>=10.1",
    "psutil",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
transcritor = "transcritor.cli:main"

[project.gui-scripts]
transcritor-app = "transcritor.gui.app:main"

[tool.setuptools.packages.find]
include = ["transcritor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
